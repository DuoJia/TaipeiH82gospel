<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>人生財務模擬器 · 一步一年的沉浸人生</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root{
    --bg:#070b12; --card:rgba(20,27,43,.78); --line:rgba(255,255,255,.08);
    --txt:#f5f7fb; --sub:#93a1b8; --pri:#6366f1; --green:#10b981;
    --blue:#38bdf8; --amber:#f59e0b; --rose:#f43f5e; --purple:#a855f7;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg);
    background-image:radial-gradient(circle at 50% -10%,rgba(99,102,241,.18),transparent 55%);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;
    padding:14px 14px 40px; min-height:100vh; line-height:1.55;
  }
  .wrap{max-width:560px;margin:0 auto}
  .brand{font-size:1.05rem;font-weight:800;letter-spacing:.5px;
    background:linear-gradient(135deg,#c7d2fe,#6366f1,#38bdf8);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .tag{font-size:.7rem;color:#a5b4fc;background:rgba(99,102,241,.16);
    border:1px solid rgba(99,102,241,.3);padding:4px 10px;border-radius:20px}

  /* ---------- intro ---------- */
  .hero{text-align:center;padding:26px 8px 10px}
  .hero h1{font-size:1.75rem;font-weight:900;line-height:1.3;margin-bottom:10px;
    background:linear-gradient(135deg,#fff,#a5b4fc 60%,#38bdf8);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hero p{color:var(--sub);font-size:.9rem}
  .hero .em{color:#fca5a5}
  .profiles{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .profile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;
    display:flex;gap:14px;align-items:flex-start;cursor:pointer;transition:.18s;
    backdrop-filter:blur(10px)}
  .profile:active{transform:scale(.99)}
  .profile.sel{border-color:rgba(99,102,241,.75);box-shadow:0 0 0 3px rgba(99,102,241,.15),0 8px 30px rgba(0,0,0,.4)}
  .p-icon{font-size:1.7rem;line-height:1}
  .p-name{font-weight:700;font-size:.98rem;margin-bottom:3px}
  .p-desc{font-size:.78rem;color:var(--sub);margin-bottom:7px}
  .p-tags{display:flex;gap:6px;flex-wrap:wrap}
  .p-tag{font-size:.68rem;color:#c7d2fe;background:rgba(99,102,241,.15);
    border:1px solid rgba(99,102,241,.25);padding:2px 8px;border-radius:10px}
  .btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;
    font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
  .btn:active{transform:scale(.985)}
  .btn-pri{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;
    box-shadow:0 8px 24px rgba(99,102,241,.35)}
  .btn-ghost{background:rgba(255,255,255,.06);color:var(--sub);border:1px solid var(--line)}
  .mt12{margin-top:12px}.mt18{margin-top:18px}
  .note{font-size:.72rem;color:#64748b;text-align:center;margin-top:14px;line-height:1.7}

  /* ---------- hud ---------- */
  .hud{background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:14px;margin-bottom:12px;backdrop-filter:blur(12px)}
  .hud-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
  .age{font-size:1.5rem;font-weight:900;letter-spacing:-.5px}
  .age small{font-size:.72rem;font-weight:500;color:var(--sub);margin-left:6px}
  .nw{text-align:right}
  .nw-num{font-size:1.3rem;font-weight:800;color:var(--green)}
  .nw-num.neg{color:var(--rose)}
  .nw-lb{font-size:.66rem;color:var(--sub)}
  .grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:4px}
  .cell{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);
    border-radius:11px;padding:8px 10px}
  .cell .k{font-size:.64rem;color:var(--sub)}
  .cell .v{font-size:.86rem;font-weight:700;margin-top:1px}
  .bars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .bar-l{display:flex;justify-content:space-between;font-size:.68rem;color:var(--sub);margin-bottom:4px}
  .bar-bg{height:6px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden}
  .bar-f{height:100%;border-radius:6px;transition:width .4s ease}

  /* ---------- card ---------- */
  .ev{background:linear-gradient(180deg,rgba(30,41,64,.95),rgba(17,24,39,.92));
    border:1px solid rgba(129,140,248,.22);border-radius:22px;padding:18px 16px;
    margin-bottom:12px;box-shadow:0 12px 40px rgba(0,0,0,.45);animation:pop .28s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .ev-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .ev-icon{font-size:1.5rem}
  .ev-title{font-size:1rem;font-weight:800;letter-spacing:.2px}
  .ev-kind{font-size:.6rem;color:#a5b4fc;border:1px solid rgba(129,140,248,.35);
    padding:1px 7px;border-radius:20px;margin-left:auto;white-space:nowrap}
  .ev-text{font-size:.88rem;color:#cbd5e1;line-height:1.75;margin-bottom:14px}
  .opt{width:100%;text-align:left;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);
    border-radius:13px;padding:12px 13px;margin-bottom:8px;color:var(--txt);cursor:pointer;
    font-family:inherit;transition:.15s}
  .opt:active{transform:scale(.99);background:rgba(99,102,241,.12)}
  .opt.primary{border-color:rgba(99,102,241,.55);background:rgba(99,102,241,.12)}
  .opt.danger{border-color:rgba(244,63,94,.4);background:rgba(244,63,94,.08)}
  .opt-l{font-size:.9rem;font-weight:700;display:flex;gap:8px;align-items:center}
  .opt-s{font-size:.72rem;color:var(--sub);margin-top:3px}
  .odds{font-size:.62rem;color:#fbbf24;border:1px solid rgba(251,191,36,.35);
    background:rgba(251,191,36,.1);padding:1px 6px;border-radius:8px;font-weight:600}

  .result{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.28);
    border-radius:16px;padding:14px;margin-bottom:12px;font-size:.86rem;color:#d1fae5;
    animation:pop .25s ease}

  /* ---------- year ---------- */
  .yr{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;
    padding:11px 13px;margin-bottom:12px;font-size:.75rem;color:var(--sub)}
  .yr-row{display:flex;justify-content:space-between;padding:2px 0}
  .yr-row b{color:#e2e8f0;font-weight:700}
  .pos{color:var(--green)!important}.neg{color:var(--rose)!important}

  .chartbox{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:12px 10px 6px;margin-bottom:12px}
  .chartbox h3{font-size:.76rem;color:var(--sub);margin:0 0 6px 6px;font-weight:600}

  .logbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
  .logbox h3{font-size:.76rem;color:var(--sub);margin-bottom:8px;font-weight:600}
  .logi{font-size:.74rem;color:#cbd5e1;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.06);
    display:flex;gap:8px}
  .logi:last-child{border:none}
  .logi span.a{color:#64748b;font-size:.68rem;min-width:42px}

  /* ---------- ending ---------- */
  .end{text-align:center;padding:8px 0 4px;animation:pop .4s ease}
  .end-icon{font-size:3.2rem;line-height:1.1;margin-bottom:6px}
  .end-title{font-size:1.5rem;font-weight:900;margin-bottom:4px}
  .end-sub{font-size:.7rem;letter-spacing:3px;color:var(--sub);margin-bottom:12px}
  .end-desc{font-size:.88rem;color:#cbd5e1;line-height:1.8;margin-bottom:16px;padding:0 4px}
  .rankbox{display:flex;align-items:center;justify-content:center;gap:16px;
    background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.3);
    border-radius:18px;padding:14px;margin-bottom:14px}
  .rank{font-size:2.4rem;font-weight:900;
    background:linear-gradient(135deg,#fbbf24,#f43f5e);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent}
  .score{font-size:1.6rem;font-weight:900;color:#fff}
  .rank small{font-size:.62rem;color:var(--sub);display:block;-webkit-text-fill-color:var(--sub);font-weight:600}
  .stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .stat3 .cell{text-align:center}
  .stat3 .v{font-size:.95rem}
  .end-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  .end-actions .btn{padding:13px;font-size:.86rem}

  .footer{text-align:center;font-size:.68rem;color:#475569;margin-top:20px;line-height:1.9}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ 開場 ============ -->
  <section id="intro">
    <div class="hero">
      <h1>你的人生，<br>只剩 68 次選擇</h1>
      <p>18 歲到 85 歲，一年一回合。<br>每個決定、每場意外，都會改變你的結局。</p>
      <p class="em" style="margin-top:8px;font-size:.8rem">⚠️ 這不是勵志遊戲，這是警世遊戲</p>
    </div>

    <div class="profiles" id="profiles"></div>

    <button class="btn btn-pri mt18" id="startBtn">開始我的人生 →</button>
    <button class="btn btn-ghost mt12 hidden" id="resumeBtn">繼續上次的人生</button>
    <p class="note">房租、通膨、薪資天花板都照台灣現實設定。<br>每次開局的隨機事件都不同，玩壞了可以重來，人生不行。</p>
  </section>

  <!-- ============ 遊戲 ============ -->
  <section id="game" class="hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="brand">人生財務模擬器</div>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="tag" id="tagTurn">第 1 回合</div>
        <button id="restartBtn" style="background:none;border:1px solid rgba(255,255,255,.12);color:#64748b;border-radius:10px;padding:4px 9px;font-size:.68rem;font-family:inherit;cursor:pointer">重來</button>
      </div>
    </div>

    <div class="hud">
      <div class="hud-top">
        <div>
          <div class="age"><span id="hudAge">18</span><small>歲 · <span id="hudYear">2026</span></small></div>
          <div style="font-size:.72rem;color:#94a3b8" id="hudJob">學生</div>
        </div>
        <div class="nw">
          <div class="nw-num" id="hudNW">$0</div>
          <div class="nw-lb">淨資產</div>
        </div>
      </div>
      <div class="grid4">
        <div class="cell"><div class="k">現金</div><div class="v" id="hudCash">$0</div></div>
        <div class="cell"><div class="k" id="investLabel">投資</div><div class="v" id="hudInvest">$0</div></div>
        <div class="cell"><div class="k">負債</div><div class="v neg" id="hudDebt">$0</div></div>
        <div class="cell"><div class="k">月收 / 月支</div><div class="v" id="hudFlow">$0 / $0</div></div>
      </div>
      <div class="bars">
        <div>
          <div class="bar-l"><span>❤️ 健康</span><span id="hpTxt">85</span></div>
          <div class="bar-bg"><div class="bar-f" id="hpBar" style="width:85%;background:linear-gradient(90deg,#f43f5e,#fb7185)"></div></div>
        </div>
        <div>
          <div class="bar-l"><span>🙂 快樂</span><span id="joyTxt">70</span></div>
          <div class="bar-bg"><div class="bar-f" id="joyBar" style="width:70%;background:linear-gradient(90deg,#6366f1,#a855f7)"></div></div>
        </div>
      </div>
    </div>

    <div id="yearBox"></div>
    <div id="cardBox"></div>
    <div id="resultBox"></div>

    <div class="chartbox">
      <h3>淨資產曲線</h3>
      <canvas id="chart" height="150"></canvas>
    </div>

    <div class="logbox">
      <h3>人生大事記</h3>
      <div id="logList"></div>
    </div>

    <div class="footer">一年一回合 · 共 68 回合 · v2 現實平衡版（2026-10-27）<br>房租／通膨／薪資天花板皆依台灣現況設定，數字為模擬，非投資建議</div>
  </section>

</div>

<script src="game.js"></script>
<script>
(function(){
  const G = window.LifeGame;
  const $ = id => document.getElementById(id);
  const fmt = n => {
    const neg = n < 0, a = Math.abs(n);
    let s;
    if (a >= 100000000) s = (a/100000000).toFixed(2) + '億';
    else if (a >= 10000) s = (a/10000).toFixed(a >= 1000000 ? 0 : 1) + '萬';
    else s = Math.round(a).toLocaleString();
    return (neg ? '-' : '') + '$' + s;
  };

  let state = null;
  let chart = null;
  let selected = 'office';
  const SAVE_KEY = 'lifeGame.v1';

  /* ---------- 角色卡 ---------- */
  function renderProfiles(){
    const box = $('profiles');
    box.innerHTML = Object.values(G.PROFILES).map(p => `
      <div class="profile ${p.id===selected?'sel':''}" data-id="${p.id}">
        <div class="p-icon">${p.icon}</div>
        <div style="flex:1">
          <div class="p-name">${p.name}</div>
          <div class="p-desc">${p.desc}</div>
          <div class="p-tags">${p.tags.map(t=>`<span class="p-tag">${t}</span>`).join('')}</div>
        </div>
      </div>`).join('');
    box.querySelectorAll('.profile').forEach(el=>{
      el.onclick = () => { selected = el.dataset.id; renderProfiles(); };
    });
  }

  /* ---------- HUD ---------- */
  function renderHUD(){
    const s = state;
    $('hudAge').textContent = s.age;
    $('hudYear').textContent = s.year;
    $('hudJob').textContent = s.job;
    const nw = G.netWorth(s);
    const nwEl = $('hudNW');
    nwEl.textContent = fmt(nw);
    nwEl.className = 'nw-num' + (nw < 0 ? ' neg' : '');
    $('hudCash').textContent = fmt(s.cash);
    $('hudInvest').textContent = fmt(s.invest + (s.house||0));
    $('investLabel').textContent = s.house ? '投資＋房產' : '投資';
    $('hudDebt').textContent = s.debt > 0 ? '-' + fmt(s.debt) : '0';
    $('hudFlow').textContent = fmt(s.income + (s.pension || 0)) + ' / ' + fmt(s.expense);
    $('hpTxt').textContent = Math.round(s.health);
    $('joyTxt').textContent = Math.round(s.happy);
    $('hpBar').style.width = Math.max(0, Math.min(100, s.health)) + '%';
    $('joyBar').style.width = Math.max(0, Math.min(100, s.happy)) + '%';
    $('tagTurn').textContent = '第 ' + (s.age - 17) + ' / 67 回合';

    const ly = s.lastYear;
    if (ly){
      const m = ly.market;
      $('yearBox').innerHTML = `
        <div class="yr">
          <div class="yr-row"><span>${ly.year} 年結算 · 市場 ${m.icon} ${m.name}（投資 ${(ly.invRate*100).toFixed(1)}%）</span></div>
          <div class="yr-row"><span>年收入（薪水）</span><b class="pos">+${fmt(ly.income)}</b></div>
          ${ly.pension ? `<div class="yr-row"><span>年收入（年金）</span><b class="pos">+${fmt(ly.pension)}</b></div>` : ''}
          ${ly.rent ? `<div class="yr-row"><span>其中房租</span><b class="neg">-${fmt(ly.rent)}</b></div>` : ''}
          <div class="yr-row"><span>年支出（含負債月付）</span><b class="neg">-${fmt(ly.expense + ly.debtPay)}</b></div>
          <div class="yr-row"><span>投資損益</span><b class="${ly.invDelta>=0?'pos':'neg'}">${ly.invDelta>=0?'+':''}${fmt(ly.invDelta)}</b></div>
          <div class="yr-row" style="border-top:1px dashed rgba(255,255,255,.08);margin-top:4px;padding-top:6px">
            <span>淨資產</span><b>${fmt(ly.netWorth)}</b></div>
        </div>`;
    } else {
      $('yearBox').innerHTML = '';
    }
    renderChart();
    renderLog();
  }

  /* ---------- 卡片 ---------- */
  function renderCard(card){
    if (!card) return;
    if (card.kind === 'ending'){ renderEnding(card); return; }
    const kindLabel = card.kind === 'milestone' ? '人生抉擇' : card.kind === 'event' ? '隨機事件' : '平淡';
    $('resultBox').innerHTML = '';
    $('cardBox').innerHTML = `
      <div class="ev">
        <div class="ev-head">
          <div class="ev-icon">${card.icon || '🎲'}</div>
          <div class="ev-title">${card.title || ''}</div>
          <div class="ev-kind">${kindLabel}</div>
        </div>
        <div class="ev-text">${card.text || ''}</div>
        <div id="opts">
          ${(card.options||[]).map((o,i)=>`
            <button class="opt ${o.tone||''}" data-i="${i}">
              <div class="opt-l">${o.label}${o.odds?`<span class="odds">${o.odds}</span>`:''}</div>
              ${o.sub?`<div class="opt-s">${o.sub}</div>`:''}
            </button>`).join('')}
        </div>
      </div>`;
    $('opts').querySelectorAll('.opt').forEach(b=>{
      b.onclick = () => choose(parseInt(b.dataset.i,10));
    });
  }

  function choose(i){
    const card = state.current;
    const label = card.options[i] ? card.options[i].label : '';
    const result = G.resolve(state, i);
    document.querySelectorAll('#opts .opt').forEach(b=>b.disabled = true);

    const autoNext = (!result && card.options.length === 1);
    if (autoNext) {
      const next = G.advance(state);
      renderHUD(); renderCard(next); save();
      return;
    }
    $('resultBox').innerHTML = `
      <div class="result">
        <div style="font-weight:700;margin-bottom:5px">▸ 你選擇了：${label}</div>
        <div style="line-height:1.75">${result || '（這一步沒有留下註記）'}</div>
      </div>
      <button class="btn btn-pri" id="nextBtn">下一年 →</button>`;
    $('nextBtn').onclick = () => {
      $('resultBox').innerHTML = '';
      const next = G.advance(state);
      renderHUD();
      renderCard(next);
      save();
    };
    renderHUD();
  }

  /* ---------- 圖表 ---------- */
  function renderChart(){
    if (typeof Chart === 'undefined') return;
    const h = state.history.slice(-70);
    const labels = h.map(x=>x.age + '歲');
    const data = h.map(x=>Math.round(x.net/10000));
    if (!chart){
      chart = new Chart($('chart').getContext('2d'), {
        type:'line',
        data:{labels, datasets:[{
          data, borderColor:'#818cf8', backgroundColor:'rgba(129,140,248,.18)',
          fill:true, tension:.25, pointRadius:0, borderWidth:2
        }]},
        options:{
          responsive:true, maintainAspectRatio:true,
          plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>'淨資產 '+c.parsed.y+' 萬'}}},
          scales:{
            x:{grid:{display:false}, ticks:{color:'#475569', font:{size:9}, maxTicksLimit:6}},
            y:{grid:{color:'rgba(255,255,255,.05)'}, ticks:{color:'#475569', font:{size:9}, callback:v=>v+'萬'}}
          }
        }
      });
    } else {
      chart.data.labels = labels;
      chart.data.datasets[0].data = data;
      chart.update('none');
    }
  }

  /* ---------- 日誌 ---------- */
  function renderLog(){
    const items = state.log.slice(-10).reverse();
    $('logList').innerHTML = items.map(x=>`
      <div class="logi"><span class="a">${x.age}歲</span><span>${x.icon} ${x.text}</span></div>`).join('');
  }

  /* ---------- 結局 ---------- */
  function renderEnding(card){
    const s = state;
    const story = s.log.map(x=>`${x.age}歲 ${x.icon} ${x.text}`).join('\n');
    $('cardBox').innerHTML = `
      <div class="ev">
        <div class="end">
          <div class="end-icon">${card.icon}</div>
          <div class="end-title">${card.title}</div>
          <div class="end-sub">人 生 結 算</div>
          <div class="end-desc">${card.text}</div>
          <div class="rankbox">
            <div class="rank">${card.rank}<small>RANK</small></div>
            <div style="width:1px;height:38px;background:rgba(255,255,255,.12)"></div>
            <div><div class="score">${card.score}</div><small style="font-size:.62rem;color:#94a3b8">總分 / 100</small></div>
          </div>
          <div class="stat3">
            <div class="cell"><div class="k">最終淨資產</div><div class="v ${card.finalNetWorth<0?'neg':''}">${fmt(card.finalNetWorth)}</div></div>
            <div class="cell"><div class="k">可撐年數</div><div class="v">${card.ratio} 年</div></div>
            <div class="cell"><div class="k">財務分數</div><div class="v">${card.finScore}</div></div>
          </div>
          <div class="end-actions">
            <button class="btn btn-pri" id="againBtn">再活一次</button>
            <button class="btn btn-ghost" id="shareBtn">複製結果</button>
          </div>
        </div>
      </div>
      <div class="logbox mt12">
        <h3>人生回顧（${s.log.length} 個事件）</h3>
        <div style="max-height:320px;overflow:auto">${s.log.slice().reverse().map(x=>`
          <div class="logi"><span class="a">${x.age}歲</span><span>${x.icon} ${x.text}</span></div>`).join('')}</div>
      </div>`;

    $('againBtn').onclick = () => { reset(); };
    $('shareBtn').onclick = () => {
      const txt = `【人生財務模擬器】\n結局：${card.title} ${card.icon}\n評價：${card.rank} · ${card.score} 分\n最終淨資產：${fmt(card.finalNetWorth)}（可撐 ${card.ratio} 年）\n健康 ${Math.round(s.health)} / 快樂 ${Math.round(s.happy)}\n\n你的選擇，決定你的晚年。`;
      navigator.clipboard?.writeText(txt).then(()=>{
        $('shareBtn').textContent = '已複製 ✓';
      }).catch(()=>{ $('shareBtn').textContent = '複製失敗'; });
    };
    window.scrollTo({top:0, behavior:'smooth'});
  }

  /* ---------- 存檔 ---------- */
  function save(){
    try{
      const clone = JSON.parse(JSON.stringify(state, (k,v)=> k==='current'||k==='ending' ? undefined : v));
      clone.hasSave = !state.ended;
      localStorage.setItem(SAVE_KEY, JSON.stringify(clone));
    }catch(e){}
  }
  function loadSave(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || s.ended) return null;
      if (s.age > G.CFG.END_AGE) return null;
      return s;
    }catch(e){ return null; }
  }

  /* ---------- 開始 / 重來 ---------- */
  function reset(){
    const saved = loadSave();
    state = null;
    if (chart){ chart.destroy(); chart = null; }
    $('intro').classList.remove('hidden');
    $('game').classList.add('hidden');
    $('cardBox').innerHTML = '';
    $('resultBox').innerHTML = '';
    renderProfiles();
    $('resumeBtn').classList.toggle('hidden', !saved);
  }

  function begin(profileId, seed){
    state = G.createState(profileId, seed || (Date.now() % 2147483647));
    $('intro').classList.add('hidden');
    $('game').classList.remove('hidden');
    if (chart){ chart.destroy(); chart = null; }
    renderHUD();
    const card = G.startGame(state);
    renderCard(card);
    save();
    window.scrollTo({top:0});
  }

  $('startBtn').onclick = () => begin(selected, Date.now() % 2147483647);
  $('restartBtn').onclick = () => {
    if (confirm('確定要放棄這一生，重新開始嗎？')) { localStorage.removeItem(SAVE_KEY); reset(); }
  };
  $('resumeBtn').onclick = () => {
    const s = loadSave();
    if (!s) return;
    state = s;
    state.current = null;
    $('intro').classList.add('hidden');
    $('game').classList.remove('hidden');
    if (chart){ chart.destroy(); chart = null; }
    renderHUD();
    const card = G.resume(state);
    renderHUD(); renderCard(card); save();
  };

  /* ---------- init ---------- */
  renderProfiles();
  const sv = loadSave();
  if (sv) $('resumeBtn').classList.remove('hidden');
})();
</script>
</body>
</html>
